<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Day 1 城南动线 · 老门东 → 中华门 → 瞻园 → 夫子庙</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  html,body,#map{height:100%;margin:0;background:#f8fafc}
  .leaflet-container{font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
</style>
</head>
<body>
<div id="map" role="img" aria-label="Day 1 城南动线 · 老门东 → 中华门 → 瞻园 → 夫子庙"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const data = {"title": "Day 1 城南动线 · 老门东 → 中华门 → 瞻园 → 夫子庙", "points": [{"name": "武定门地铁站 2 号口", "lat": 32.0209, "lon": 118.7881}, {"name": "箍桶巷公交站", "lat": 32.0192, "lon": 118.7871}, {"name": "老门东牌坊", "lat": 32.0186, "lon": 118.7862}, {"name": "南京文字墙（秾粹雨花茶）", "lat": 32.0181, "lon": 118.7855}, {"name": "芥子园", "lat": 32.0176, "lon": 118.7846}, {"name": "德云社 · 金陵文字墙", "lat": 32.0171, "lon": 118.7839}, {"name": "先锋书店（骏惠书屋）", "lat": 32.0166, "lon": 118.7831}, {"name": "南京城墙博物馆", "lat": 32.0152, "lon": 118.7812}, {"name": "中华门（瓮城）", "lat": 32.0136, "lon": 118.7788}, {"name": "瞻园西门", "lat": 32.0155, "lon": 118.7835}, {"name": "古秦淮西牌坊", "lat": 32.0207, "lon": 118.7852}, {"name": "得月台（心情杂货铺）", "lat": 32.0213, "lon": 118.7866}, {"name": "秦淮风光带东北门", "lat": 32.0227, "lon": 118.7881}], "routes": [{"from": [32.0209, 118.7881], "to": [32.0192, 118.7871], "label": "46/14 路 1 站"}, {"from": [32.0192, 118.7871], "to": [32.0186, 118.7862]}, {"from": [32.0186, 118.7862], "to": [32.0181, 118.7855]}, {"from": [32.0181, 118.7855], "to": [32.0176, 118.7846]}, {"from": [32.0176, 118.7846], "to": [32.0171, 118.7839]}, {"from": [32.0171, 118.7839], "to": [32.0166, 118.7831]}, {"from": [32.0166, 118.7831], "to": [32.0152, 118.7812]}, {"from": [32.0152, 118.7812], "to": [32.0136, 118.7788]}, {"from": [32.0136, 118.7788], "to": [32.0155, 118.7835], "label": "2/202 路"}, {"from": [32.0155, 118.7835], "to": [32.0207, 118.7852]}, {"from": [32.0207, 118.7852], "to": [32.0213, 118.7866]}, {"from": [32.0213, 118.7866], "to": [32.0227, 118.7881]}]};
const map = L.map("map", {scrollWheelZoom: true});
// Street tiles: Esri (no key). OSMF and Carto basemaps reject or watermark app use.
const TILES = [
  {
    url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    options: {
      maxZoom: 19,
      attribution: "Tiles &copy; Esri"
    }
  },
  {
    url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
    options: {
      maxZoom: 19,
      attribution: "Tiles &copy; Esri"
    }
  }
];
let tileIdx = 0;
let switched = false;
let tiles = L.tileLayer(TILES[0].url, TILES[0].options).addTo(map);
tiles.on("tileerror", function () {
  if (switched || tileIdx >= TILES.length - 1) return;
  switched = true;
  tileIdx += 1;
  map.removeLayer(tiles);
  tiles = L.tileLayer(TILES[tileIdx].url, TILES[tileIdx].options).addTo(map);
});
const layer = L.featureGroup();
data.points.forEach((p, i) => {
  const label = p.name ? (i + 1) + ". " + p.name : String(i + 1);
  L.marker([p.lat, p.lon]).bindPopup(label).addTo(layer);
});
(data.routes || []).forEach((r) => {
  if (!r.from || !r.to) return;
  L.polyline([r.from, r.to], {color: "#dc2626", weight: 3, opacity: 0.75, dashArray: "6 6"}).addTo(layer);
});
layer.addTo(map);
if (data.points.length === 1) {
  map.setView([data.points[0].lat, data.points[0].lon], 14);
} else {
  map.fitBounds(layer.getBounds().pad(0.18));
}
</script>
</body>
</html>
