<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Day 1 · 南京南 → 雨花台 → 总统府 → 秦淮</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  html,body,#map{height:100%;margin:0;background:#f8fafc}
  .leaflet-container{font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
</style>
</head>
<body>
<div id="map" role="img" aria-label="Day 1 · 南京南 → 雨花台 → 总统府 → 秦淮"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const data = {"title": "Day 1 · 南京南 → 雨花台 → 总统府 → 秦淮", "points": [{"name": "南京南站（10:21 抵达）", "lat": 31.968, "lon": 118.7969}, {"name": "中华门站（1 号线 5 站）", "lat": 32.0085, "lon": 118.7788}, {"name": "雨花台北门（进）", "lat": 32.0012, "lon": 118.7745}, {"name": "雨花台南门（出）", "lat": 31.9968, "lon": 118.7799}, {"name": "新街口 · 德基广场（午饭）", "lat": 32.0451, "lon": 118.7845}, {"name": "总统府", "lat": 32.0457, "lon": 118.7919}, {"name": "老门东（武定门站）", "lat": 32.0179, "lon": 118.7835}, {"name": "夫子庙 · 秦淮河", "lat": 32.0209, "lon": 118.7881}], "routes": [{"from": [31.968, 118.7969], "to": [32.0085, 118.7788], "label": "地铁 1 号线 5 站 · 20 分钟"}, {"from": [32.0085, 118.7788], "to": [32.0012, 118.7745], "label": "3 号口步行 500–700 米"}, {"from": [32.0012, 118.7745], "to": [31.9968, 118.7799], "label": "园内北门 → 南门 2 小时"}, {"from": [31.9968, 118.7799], "to": [32.0085, 118.7788], "label": "打车回中华门站"}, {"from": [32.0085, 118.7788], "to": [32.0451, 118.7845], "label": "1 号线 3 站到新街口"}, {"from": [32.0451, 118.7845], "to": [32.0457, 118.7919], "label": "步行 15 分钟"}, {"from": [32.0457, 118.7919], "to": [32.0179, 118.7835], "label": "3 号线 大行宫 → 武定门"}, {"from": [32.0179, 118.7835], "to": [32.0209, 118.7881], "label": "步行 15 分钟"}]};
const map = L.map("map", {scrollWheelZoom: true});
// Street tiles: Esri (no key). OSMF and Carto basemaps reject or watermark app use.
const TILES = [
  {
    url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    options: {
      maxZoom: 19,
      attribution: "Tiles &copy; Esri"
    }
  },
  {
    url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
    options: {
      maxZoom: 19,
      attribution: "Tiles &copy; Esri"
    }
  }
];
let tileIdx = 0;
let switched = false;
let tiles = L.tileLayer(TILES[0].url, TILES[0].options).addTo(map);
tiles.on("tileerror", function () {
  if (switched || tileIdx >= TILES.length - 1) return;
  switched = true;
  tileIdx += 1;
  map.removeLayer(tiles);
  tiles = L.tileLayer(TILES[tileIdx].url, TILES[tileIdx].options).addTo(map);
});
const layer = L.featureGroup();
data.points.forEach((p, i) => {
  const label = p.name ? (i + 1) + ". " + p.name : String(i + 1);
  L.marker([p.lat, p.lon]).bindPopup(label).addTo(layer);
});
(data.routes || []).forEach((r) => {
  if (!r.from || !r.to) return;
  L.polyline([r.from, r.to], {color: "#dc2626", weight: 3, opacity: 0.75, dashArray: "6 6"}).addTo(layer);
});
layer.addTo(map);
if (data.points.length === 1) {
  map.setView([data.points[0].lat, data.points[0].lon], 14);
} else {
  map.fitBounds(layer.getBounds().pad(0.18));
}
</script>
</body>
</html>
