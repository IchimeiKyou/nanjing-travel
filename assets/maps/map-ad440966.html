<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Day 2 · 钟山风景区（方案 A）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  html,body,#map{height:100%;margin:0;background:#f8fafc}
  .leaflet-container{font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
</style>
</head>
<body>
<div id="map" role="img" aria-label="Day 2 · 钟山风景区（方案 A）"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const data = {"title": "Day 2 · 钟山风景区（方案 A）", "points": [{"name": "地铁 2 号线 苜蓿园站", "lat": 32.0485, "lon": 118.8329}, {"name": "明孝陵（石象路神道）", "lat": 32.0587, "lon": 118.8432}, {"name": "下马坊（午饭）", "lat": 32.0571, "lon": 118.8381}, {"name": "中山陵", "lat": 32.0632, "lon": 118.8489}, {"name": "音乐台", "lat": 32.0609, "lon": 118.8477}, {"name": "美龄宫", "lat": 32.0619, "lon": 118.8398}, {"name": "新街口（晚餐）", "lat": 32.0451, "lon": 118.7845}], "routes": [{"from": [32.0485, 118.8329], "label": "观光车", "to": [32.0587, 118.8432]}, {"from": [32.0587, 118.8432], "label": "观光车下山", "to": [32.0571, 118.8381]}, {"from": [32.0571, 118.8381], "label": "观光车", "to": [32.0632, 118.8489]}, {"from": [32.0632, 118.8489], "label": "步行 5 分钟", "to": [32.0609, 118.8477]}, {"from": [32.0609, 118.8477], "label": "观光车 1 站", "to": [32.0619, 118.8398]}, {"from": [32.0619, 118.8398], "label": "地铁 2 号线回城", "to": [32.0451, 118.7845]}]};
const map = L.map("map", {scrollWheelZoom: true});
// Street tiles: Esri (no key). OSMF and Carto basemaps reject or watermark app use.
const TILES = [
  {
    url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    options: {
      maxZoom: 19,
      attribution: "Tiles &copy; Esri"
    }
  },
  {
    url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
    options: {
      maxZoom: 19,
      attribution: "Tiles &copy; Esri"
    }
  }
];
let tileIdx = 0;
let switched = false;
let tiles = L.tileLayer(TILES[0].url, TILES[0].options).addTo(map);
tiles.on("tileerror", function () {
  if (switched || tileIdx >= TILES.length - 1) return;
  switched = true;
  tileIdx += 1;
  map.removeLayer(tiles);
  tiles = L.tileLayer(TILES[tileIdx].url, TILES[tileIdx].options).addTo(map);
});
const layer = L.featureGroup();
data.points.forEach((p, i) => {
  const label = p.name ? (i + 1) + ". " + p.name : String(i + 1);
  L.marker([p.lat, p.lon]).bindPopup(label).addTo(layer);
});
(data.routes || []).forEach((r) => {
  if (!r.from || !r.to) return;
  L.polyline([r.from, r.to], {color: "#dc2626", weight: 3, opacity: 0.75, dashArray: "6 6"}).addTo(layer);
});
layer.addTo(map);
if (data.points.length === 1) {
  map.setView([data.points[0].lat, data.points[0].lon], 14);
} else {
  map.fitBounds(layer.getBounds().pad(0.18));
}
</script>
</body>
</html>
